name: Publish Apollo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Apollo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build all pages
        run: npm run build
      - name: Verify source pages and links
        run: npm run check
      - name: Verify root and project URL support
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {mkdtemp,cp,rm} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {spawnSync} from 'node:child_process';
          import {config} from './src/content.mjs';
          const urls=config.publicDomain&&config.indexable?[config.publicDomain]:['https://apollo.example','https://bigboy595.github.io/apollo-studio'];
          for(const url of urls){
            const directory=await mkdtemp(join(tmpdir(),'apollo-pages-'));
            try{
              await cp('dist',directory,{recursive:true});
              const result=spawnSync(process.execPath,['scripts/prepare-pages.mjs'],{stdio:'inherit',env:{...process.env,PAGES_SITE_URL:url,PAGES_OUTPUT_DIR:directory}});
              if(result.status!==0)process.exit(result.status||1);
            }finally{await rm(directory,{recursive:true,force:true});}
          }
          NODE
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Read domain configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/pages',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!response.ok)throw new Error('Cannot read Pages configuration: '+response.status);
          const value=await response.json();
          console.log('PAGES_STATE '+JSON.stringify({cname:value.cname,url:value.html_url,https_enforced:value.https_enforced,certificate:value.https_certificate,build_type:value.build_type}));
          NODE
      - name: Prepare published URLs and resources
        env:
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/prepare-pages.mjs
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the published website and DNS
        env:
          PAGES_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile,readdir} from 'node:fs/promises';
          import {resolve,relative,sep} from 'node:path';
          import {setTimeout} from 'node:timers/promises';
          import {resolve4,resolve6,resolveCname} from 'node:dns/promises';
          import http from 'node:http';
          import https from 'node:https';
          import assert from 'node:assert/strict';
          const configured=new URL(process.env.PAGES_SITE_URL);
          configured.protocol='https:';
          const base=configured.href.replace(/\/$/,'');
          const root=resolve('dist');
          const targets=['185.199.108.153','185.199.109.153','185.199.110.153','185.199.111.153'];
          const records={};
          for(const [type,resolveDns,name] of [['A',resolve4,configured.hostname],['AAAA',resolve6,configured.hostname],['wwwCNAME',resolveCname,'www.'+configured.hostname]]){
           try{records[type]=await resolveDns(name);}catch(error){records[type]=error.code;}
          }
          console.log('DOMAIN_DNS '+JSON.stringify({host:configured.hostname,...records}));
          async function files(dir){
           const out=[];
           for(const entry of await readdir(dir,{withFileTypes:true})){
            if(entry.name.startsWith('.'))continue;
            const path=resolve(dir,entry.name);
            out.push(...entry.isDirectory()?await files(path):[path]);
           }
           return out;
          }
          function request(url,edge=null){
           return new Promise((resolveRequest,reject)=>{
            const address=new URL(url);
            const options={headers:{'User-Agent':'Apollo-deployment-verification','Cache-Control':'no-cache'}};
            if(edge)options.lookup=(_hostname,settings,callback)=>settings.all?callback(null,[{address:edge,family:4}]):callback(null,edge,4);
            const transport=address.protocol==='https:'?https:http;
            const connection=transport.get(address,options,response=>{
             const chunks=[];
             response.on('data',chunk=>chunks.push(chunk));
             response.on('end',()=>resolveRequest({status:response.statusCode,body:Buffer.concat(chunks)}));
            });
            connection.on('error',reject);
            connection.setTimeout(15000,()=>connection.destroy(new Error('Request timed out')));
           });
          }
          const homepage=await readFile(resolve(root,'index.html'));
          const candidates=[
           {base,edge:null,label:'HTTPS'},
           ...targets.map(edge=>({base:base.replace(/^https:/,'http:'),edge,label:'EDGE_HTTP'})),
           ...targets.map(edge=>({base,edge,label:'EDGE_HTTPS'}))
          ];
          let selected;
          for(let attempt=0;attempt<12&&!selected;attempt++){
           for(const candidate of candidates){
            try{
             const result=await request(candidate.base+'/',candidate.edge);
             if(result.status===200&&result.body.equals(homepage)){selected=candidate;break;}
            }catch{}
           }
           if(!selected&&attempt<11)await setTimeout(5000);
          }
          assert(selected,'The deployment completed, but the website is not yet readable at the public or GitHub edge address');
          async function verify(path){
           const name=relative(root,path).split(sep).join('/');
           const route=name==='index.html'?'':name.endsWith('/index.html')?name.slice(0,-10):name;
           const expected=await readFile(path);
           let problem;
           for(let attempt=0;attempt<6;attempt++){
            try{
             const response=await request(selected.base+'/'+route,selected.edge);
             assert.equal(response.status,200,'HTTP '+response.status);
             assert(response.body.equals(expected),'Published bytes differ from the built file');
             return;
            }catch(error){problem=error;if(attempt<5)await setTimeout(5000);}
           }
           throw new Error('Live verification failed for '+route+': '+problem.message);
          }
          const paths=(await files(root)).filter(path=>path!==resolve(root,'index.html'));
          for(let i=0;i<paths.length;i+=4)await Promise.all(paths.slice(i,i+4).map(verify));
          console.log('PUBLISHED_OK '+base+'; verified '+(paths.length+1)+' published files; transport='+selected.label);
          if(selected.edge)console.log('DOMAIN_SETUP_PENDING: GitHub serves the verified website; public domain DNS or HTTPS still needs to finish.');
          NODE
